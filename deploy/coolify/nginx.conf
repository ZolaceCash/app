# nginx between Coolify's proxy and the site. Coolify's proxy takes the domain and the
# certificate; this takes what the site says of itself and the proxy does not do:
# - No access log here. (Coolify's own proxy may keep one: deploy/README.md, "On Coolify".)
# - The visitor's address is not passed on to the site. It is used here to slow down floods, held
#   in memory for that, and stripped before the request goes on. The site only ever sees nginx.

# Who is asking, for the limits below only: the address Cloudflare reports if the domain is
# behind Cloudflare, else the one Coolify's proxy reports.
map $http_cf_connecting_ip $visitor {
  default $http_cf_connecting_ip;
  ""      $http_x_forwarded_for;
}
limit_req_zone $visitor zone=orders:10m rate=20r/m;
limit_req_zone $visitor zone=signin:10m rate=10r/m;

upstream zolace_app {
  server app:3000;
  keepalive 16;
}

# www goes to the bare name, so an order link has one spelling. It works for whichever domain
# Coolify sends here, so both names can be set on this service.
server {
  listen 80;
  listen [::]:80;
  server_name ~^www[.](?<bare>.+)$;
  access_log off;
  return 301 https://$bare$request_uri;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  # The largest thing the site accepts is a paste of codes on the owner's stock screen.
  client_max_body_size 2m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # A link out of the site carries no address of the page it was on: an order's address stays here.
  add_header Referrer-Policy "no-referrer" always;
  # The site uses none of these, so no page and no frame in it may.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  # Coolify's proxy is where HTTPS ends. Visitors only ever reach the site through it.
  proxy_set_header X-Forwarded-Proto https;
  # Not passed on: who is asking.
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Real-IP "";
  proxy_set_header True-Client-IP "";
  # The site streams its pages: hand each piece on as it comes.
  proxy_buffering off;
  proxy_read_timeout 60s;

  # Starting an order sets a code aside for 15 minutes, so it is the thing worth flooding.
  location = /api/orders {
    limit_req zone=orders burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://zolace_app;
  }

  # The owner's sign-in. The site itself also makes every attempt wait.
  location = /owner/login {
    limit_req zone=signin burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://zolace_app;
  }

  # The vault's lists. Public and the same for everyone, but each answer carries every funded
  # month whole, so it is not handed out without a limit.
  location /api/vault/ {
    limit_req zone=orders burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://zolace_app;
  }

  location / {
    proxy_pass http://zolace_app;
  }
}
