<!doctype html>
<!--
  The picture for the post about the first item on the shelf, 1600 x 900. brand/render.mjs renders
  it at twice the size. Its layout is its own: one object in the middle, the item drawn as a SIM
  card with the site's cut corner, and one line of facts under it.
  What it says is the item as the owner entered it (12 Oct 2026): a US data eSIM, 1 GB, 7 days,
  data only, the 7 days starting at first connection. It names no carrier, because the item's
  own line names none, and the owner asked for the picture to leave out the network type and
  what the plan does not include; the item's page states both.
  The price comes from the address, so the picture follows the shelf:  x-post-item.html?price=5.99
  Do not post it before the item is on the live shelf at that price.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #09090b;
        --ice: #f4f4f6;
        --indigo: #5567ea;
        --brand: #7b8cff;
        --navy: #1f2358;
        --quiet: rgb(244 244 246 / 0.58);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background-color: var(--ground);
        /* The site's ground: a faint grid of dots. */
        background-image: radial-gradient(rgb(255 255 255 / 0.055) 1px, transparent 1px);
        background-size: 28px 28px;
        color: var(--ice);
        font-family: "Geist", system-ui, sans-serif;
        position: relative;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .top {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* The site's logo as it stands in the nav: the mark beside the name in bold lowercase. */
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .logo svg {
        width: 40px;
        height: 40px;
        fill: currentColor;
      }
      .first {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--brand);
      }
      .first::before {
        content: "";
        width: 8px;
        height: 8px;
        background: currentColor;
      }
      /* The card. Its shadow is on the wrapper, because the cut corner clips the card itself. */
      .lift {
        position: absolute;
        left: 400px;
        top: 150px;
        width: 800px;
        height: 500px;
        transform: rotate(-3deg);
        filter: drop-shadow(0 46px 60px rgb(0 0 0 / 0.75));
      }
      .sim {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 44px 48px;
        border-radius: 40px;
        background: var(--indigo);
        color: #fff;
        clip-path: polygon(0 0, calc(100% - 130px) 0, 100% 130px, 100% 100%, 0 100%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .sim canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .sim > * {
        position: relative;
      }
      .sim .mono {
        font-size: 16px;
      }
      .middle {
        display: flex;
        align-items: center;
        gap: 52px;
      }
      /* The contacts of a SIM: nine pads, the middle column joined. */
      .chip {
        flex: none;
        width: 172px;
        height: 136px;
        padding: 9px;
        border-radius: 24px;
        background: var(--navy);
        display: grid;
        grid-template-columns: 1fr 0.8fr 1fr;
        grid-template-rows: repeat(3, 1fr);
        gap: 7px;
      }
      .chip i {
        border-radius: 8px;
        background: var(--ice);
      }
      .chip i:nth-child(2) {
        grid-row: span 3;
      }
      .size {
        font-weight: 500;
        font-size: 176px;
        line-height: 0.86;
        letter-spacing: -0.06em;
        white-space: nowrap;
      }
      .days {
        margin-top: 14px;
        font-weight: 500;
        font-size: 60px;
        line-height: 1;
        letter-spacing: -0.045em;
        color: rgb(255 255 255 / 0.8);
      }
      .foot {
        display: flex;
        justify-content: space-between;
      }
      .foot span + span {
        opacity: 0.75;
      }
      .facts {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 64px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .name {
        font-weight: 500;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.045em;
      }
      .facts .mono {
        margin-top: 18px;
        color: var(--quiet);
      }
      .cost {
        text-align: right;
      }
      .price {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 92px;
        line-height: 0.82;
        letter-spacing: -0.07em;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <p class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="8.1,2 22,2 13.25,14.5 10.65,14.5 15.9,7 4.6,7" />
          <polygon points="19.4,17 15.9,22 2,22 10.75,9.5 13.35,9.5 8.1,17" />
          <polygon points="5.5,2 7,2 3.5,7 2,7" />
          <polygon points="20.5,17 22,17 18.5,22 17,22" />
        </svg>
        zolace
      </p>
      <span class="mono first">First item on the shelf</span>
    </div>

    <div class="lift">
      <div class="sim">
        <canvas></canvas>
        <div class="mono">eSIM · United States</div>
        <div class="middle">
          <div class="chip"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div>
            <p class="size">1 GB</p>
            <p class="days">7 days of data</p>
          </div>
        </div>
        <div class="mono foot"><span>Opens in your browser</span><span>01</span></div>
      </div>
    </div>

    <div class="facts">
      <div>
        <p class="name">US data eSIM</p>
        <p class="mono">Pure data · Your 7 days start at first connection</p>
      </div>
      <div class="cost">
        <p class="price" id="price"></p>
        <p class="mono">Paid in shielded ZEC · No account</p>
      </div>
    </div>

    <script>
      // The price as the shelf has it. Without one the picture shows none, and is not to be posted.
      const asked = new URLSearchParams(location.search).get("price") ?? ""
      document.getElementById("price").textContent = /^\d+(\.\d{2})?$/.test(asked) ? `$${asked}` : ""

      // The site's shader graphic, drawn once on a canvas: the same noise, the same ordered dither,
      // one canvas pixel for every three on the page (components/site/shader-fill.tsx).
      const CELL = 3
      const fract = (x) => x - Math.floor(x)
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)))
        return t * t * (3 - 2 * t)
      }
      const hash = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453)
      const noise = (x, y) => {
        const ix = Math.floor(x)
        const iy = Math.floor(y)
        let fx = x - ix
        let fy = y - iy
        fx = fx * fx * (3 - 2 * fx)
        fy = fy * fy * (3 - 2 * fy)
        const top = hash(ix, iy) + (hash(ix + 1, iy) - hash(ix, iy)) * fx
        const bottom = hash(ix, iy + 1) + (hash(ix + 1, iy + 1) - hash(ix, iy + 1)) * fx
        return top + (bottom - top) * fy
      }
      const fbm = (x, y) => {
        let value = 0
        let weight = 0.5
        for (let i = 0; i < 4; i++) {
          value += weight * noise(x, y)
          x *= 2.03
          y *= 2.03
          weight *= 0.5
        }
        return value
      }
      const bayer2 = (x, y) => fract(Math.floor(x) / 2 + Math.floor(y) * Math.floor(y) * 0.75)
      const bayer4 = (x, y) => bayer2(0.5 * x, 0.5 * y) * 0.25 + bayer2(x, y)

      const canvas = document.querySelector("canvas")
      const width = Math.round(canvas.clientWidth / CELL)
      const height = Math.round(canvas.clientHeight / CELL)
      canvas.width = width
      canvas.height = height
      const context = canvas.getContext("2d")
      context.fillStyle = "#1f2358"
      const aspect = width / height
      for (let py = 0; py < height; py++) {
        for (let px = 0; px < width; px++) {
          const u = (px + 0.5) / width
          // v runs upward, as in the shader.
          const v = 1 - (py + 0.5) / height
          const value = smoothstep(0.3, 0.8, fbm(u * aspect * 2.4 + 5.3, v * 2.4 + 2.2))
          // Kept to the right edge, under the cut corner and clear of the words.
          const room = smoothstep(0.78, 1, u) * smoothstep(0.1, 0.3, v) * (1 - smoothstep(0.62, 0.76, v))
          if (bayer4(px, height - py) + 0.03 <= value * room) context.fillRect(px, py, 1, 1)
        }
      }
    </script>
  </body>
</html>
