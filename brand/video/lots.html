<!doctype html>
<!--
  A short film for the post about holding more and earning more: the staircase of
  brand/x-post-lots.html, built as you watch. One block drops in for each lot of 3,000,000, the
  amount over each step counts up, and then three hours pass, each paying every step its part.
  Drawn and encoded one frame at a time (encode.js); opened by compose.mjs with PAGE=lots.html.
  ?still=<seconds> draws one moment and stops.
  The figures are the rule as the owner set it: 0.01 USD an hour for a lot is a ceiling, and whole
  lots multiply. So the film says "up to" wherever an amount stands.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <script type="module">
      const W = 1920
      const H = 1080
      const GROUND = "#09090b"
      const ICE = "#f4f4f6"
      const QUIET = "rgba(244,244,246,0.58)"
      const BRAND = "#7b8cff"
      const SANS = "Geist, system-ui, sans-serif"
      const MONO = '"Geist Mono", ui-monospace, monospace'
      const TOTAL = 12.6

      const canvas = document.getElementById("stage")
      const ctx = canvas.getContext("2d")
      const clamp = (x, low = 0, high = 1) => Math.min(high, Math.max(low, x))
      const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
      // Lands a little past its place and settles back.
      const settle = (x) => {
        const t = clamp(x)
        const c = 1.9
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2)
      }
      const rounded = (x, y, w, h, r) => {
        ctx.beginPath()
        ctx.roundRect(x, y, w, h, r)
      }
      const text = (value, x, y, font, colour, align = "left", spacing = "0px") => {
        ctx.font = font
        ctx.fillStyle = colour
        ctx.textAlign = align
        ctx.letterSpacing = spacing
        ctx.fillText(value, x, y)
      }
      const rise = (value, x, y, size, font, colour, p, spacing = "0px") => {
        if (p <= 0) return
        ctx.save()
        ctx.beginPath()
        ctx.rect(0, y - size * 0.95, W, size * 1.22)
        ctx.clip()
        ctx.globalAlpha *= clamp(p * 1.6)
        text(value, x, y + (1 - easeOut(p)) * size * 0.9, font, colour, "left", spacing)
        ctx.restore()
      }
      const MARK = [
        [8.1, 2, 22, 2, 13.25, 14.5, 10.65, 14.5, 15.9, 7, 4.6, 7],
        [19.4, 17, 15.9, 22, 2, 22, 10.75, 9.5, 13.35, 9.5, 8.1, 17],
        [5.5, 2, 7, 2, 3.5, 7, 2, 7],
        [20.5, 17, 22, 17, 18.5, 22, 17, 22],
      ]
      const logo = (x, y, size, colour) => {
        ctx.fillStyle = colour
        const k = size / 24
        for (const points of MARK) {
          ctx.beginPath()
          for (let i = 0; i < points.length; i += 2) ctx[i ? "lineTo" : "moveTo"](x + points[i] * k, y + points[i + 1] * k)
          ctx.closePath()
          ctx.fill()
        }
        text("zolace", x + size * 1.28, y + size * 0.86, `700 ${size * 0.95}px ${SANS}`, colour, "left", `${-size * 0.05}px`)
      }

      // The staircase: where it stands and when each part of it arrives.
      const LOTS = [1, 2, 3, 4, 5]
      const BLOCK = { w: 170, h: 84, gap: 11, between: 17 }
      const BASE = 838
      const LEFT = W - 96 - (LOTS.length * BLOCK.w + (LOTS.length - 1) * BLOCK.between)
      const BUILD = 1.5
      const PER_STEP = 0.72
      const PER_BLOCK = 0.11
      const DROP = 0.55
      const landed = (step) => BUILD + step * PER_STEP + (LOTS[step] - 1) * PER_BLOCK + DROP * 0.7
      const BUILT = landed(LOTS.length - 1) + 0.5
      // Three hours pass once it stands. Each lasts this long.
      const HOUR = 1.45
      const HOURS = 3
      const ASK = BUILT + HOURS * HOUR + 0.35

      function stairs(time) {
        const hoursIn = (time - BUILT) / HOUR
        const hour = Math.floor(hoursIn)
        const within = hoursIn - hour
        LOTS.forEach((lots, step) => {
          const x = LEFT + step * (BLOCK.w + BLOCK.between)
          const start = BUILD + step * PER_STEP
          // A wave runs along the steps at the turn of each hour, lighting each for a moment.
          const wave = time >= BUILT && hour < HOURS ? clamp(1 - Math.abs(within * 2.6 - step * 0.22 - 0.2) * 3.2) : 0
          for (let at = 0; at < lots; at++) {
            const p = (time - start - at * PER_BLOCK) / DROP
            if (p <= 0) continue
            const y = BASE - (at + 1) * BLOCK.h - at * BLOCK.gap
            const fall = (1 - settle(p)) * 240
            const shade = 0.42 + (0.58 * (at + 1)) / lots
            ctx.globalAlpha = clamp(p * 2.2) * Math.min(1, shade + wave * 0.5)
            ctx.fillStyle = wave > 0.05 ? `rgb(${85 + wave * 38}, ${103 + wave * 37}, ${234 + wave * 21})` : "#5567ea"
            rounded(x, y - fall, BLOCK.w, BLOCK.h, 17)
            ctx.fill()
          }
          ctx.globalAlpha = 1
          // What the step earns: it counts up to its amount as its last block lands.
          const arrived = (time - landed(step)) / 0.4
          if (arrived > 0) {
            const top = BASE - lots * BLOCK.h - (lots - 1) * BLOCK.gap
            const cents = Math.round((step === 0 ? 0 : LOTS[step - 1]) + (lots - (step === 0 ? 0 : LOTS[step - 1])) * easeOut(arrived))
            const pop = 1 + 0.16 * Math.sin(Math.PI * clamp(arrived))
            ctx.save()
            ctx.globalAlpha = easeOut(arrived * 1.4)
            ctx.translate(x + BLOCK.w / 2, top - 26)
            ctx.scale(pop, pop)
            text(`$${(cents / 100).toFixed(2)}`, 0, 0, `500 38px ${MONO}`, ICE, "center", "-1.9px")
            ctx.restore()
            ctx.globalAlpha = easeOut(arrived)
            text(`${(lots * 3).toLocaleString("en-US")},000,000`, x + BLOCK.w / 2, BASE + 34, `500 19px ${MONO}`, ICE, "center", "1.5px")
            ctx.globalAlpha = 1
            // Each hour pays the step its part: the amount lifts off and fades.
            if (time >= BUILT && hour < HOURS) {
              const lift = clamp((within * 2.6 - step * 0.22 - 0.25) / 1.5)
              if (lift > 0 && lift < 1) {
                ctx.globalAlpha = Math.sin(Math.PI * lift) * 0.95
                text(`+$${(lots / 100).toFixed(2)}`, x + BLOCK.w / 2, top - 72 - easeOut(lift) * 34, `500 26px ${MONO}`, BRAND, "center", "-1px")
                ctx.globalAlpha = 1
              }
            }
          }
        })
        // The hours, counted over the stairs.
        if (time >= BUILT - 0.3) {
          const shown = easeOut((time - (BUILT - 0.3)) / 0.4)
          const right = W - 96
          ctx.globalAlpha = shown
          const n = Math.min(HOURS, Math.max(1, hour + 1))
          text(`HOUR ${n} OF ${HOURS} · UP TO, EACH HOUR`, right, 184, `500 19px ${MONO}`, QUIET, "right", "1.6px")
          const wide = 300
          ctx.fillStyle = "#26262e"
          rounded(right - wide, 202, wide, 8, 4)
          ctx.fill()
          const done = clamp(hoursIn / HOURS)
          if (done > 0) {
            ctx.fillStyle = BRAND
            rounded(right - wide, 202, Math.max(8, wide * done), 8, 4)
            ctx.fill()
          }
          ctx.globalAlpha = 1
        }
      }

      function draw(time) {
        ctx.globalAlpha = 1
        ctx.fillStyle = GROUND
        ctx.fillRect(0, 0, W, H)
        ctx.fillStyle = "rgba(255,255,255,0.06)"
        const drift = (time * 5) % 28
        for (let y = 14 - 28 + drift; y < H; y += 28) for (let x = 14; x < W; x += 28) ctx.fillRect(x, y, 1.5, 1.5)

        const p = (from, length = 0.75) => clamp((time - from) / length)
        ctx.globalAlpha = easeOut(p(0, 0.5))
        logo(96, 76, 48, ICE)
        text("HOLDERS' REWARD · PAID IN NVDA", W - 96, 112, `500 21px ${MONO}`, QUIET, "right", "1.8px")
        ctx.globalAlpha = easeOut(p(0.25) * 1.4)
        ctx.fillStyle = BRAND
        ctx.fillRect(96, 358, 10, 10)
        text("THE VAULT IS LIVE", 122, 372, `500 23px ${MONO}`, BRAND, "left", "2px")
        ctx.globalAlpha = 1
        const font = `500 150px ${SANS}`
        rise("Hold more.", 90, 532, 150, font, ICE, p(0.4), "-8px")
        ctx.font = font
        ctx.letterSpacing = "-8px"
        const head = ctx.measureText("Earn ").width
        rise("Earn ", 90, 676, 150, font, ICE, p(0.55), "-8px")
        rise("more.", 90 + head, 676, 150, font, BRAND, p(0.65), "-8px")

        // The rule under the headline, and at the end the question that takes its place.
        const asking = easeOut((time - ASK) / 0.5)
        ctx.globalAlpha = easeOut(p(1.1, 0.6)) * (1 - asking)
        text("Every 3,000,000 $ZOLACE you hold is one lot.", 96, 772, `400 32px ${SANS}`, QUIET, "left", "-0.5px")
        text("Every lot earns up to $0.01 an hour.", 96, 816, `400 32px ${SANS}`, QUIET, "left", "-0.5px")
        ctx.globalAlpha = 1
        if (asking > 0) {
          ctx.globalAlpha = asking
          rise("How many lots are you at?", 94, 806, 56, `500 56px ${SANS}`, ICE, clamp((time - ASK) / 0.6), "-2.4px")
          ctx.globalAlpha = 1
        }

        stairs(time)

        ctx.globalAlpha = easeOut(p(1.3, 0.6))
        text("CLAIM AT", 96, 1004, `500 19px ${MONO}`, QUIET, "left", "1.6px")
        text("ZOLACE.CASH/VAULT", 96 + 116, 1004, `500 19px ${MONO}`, ICE, "left", "1.6px")
        text("EVERY CLAIM IS PUBLIC ON THE CHAIN · INDEPENDENT OF ROBINHOOD AND NVIDIA", W - 96, 1004, `500 19px ${MONO}`, QUIET, "right", "1.6px")
        ctx.globalAlpha = 1

        // Out to the ground at the very end, so the loop starts clean.
        const left = TOTAL - time
        if (left < 0.4) {
          ctx.globalAlpha = 1 - clamp(left / 0.4)
          ctx.fillStyle = GROUND
          ctx.fillRect(0, 0, W, H)
          ctx.globalAlpha = 1
        }
      }

      await Promise.all([
        document.fonts.load(`500 150px ${SANS}`),
        document.fonts.load(`400 32px ${SANS}`),
        document.fonts.load(`700 48px ${SANS}`),
        document.fonts.load(`500 24px ${MONO}`),
      ])
      const asked = new URLSearchParams(location.search)
      window.film = { total: TOTAL, built: +BUILT.toFixed(2), ask: +ASK.toFixed(2) }
      if (asked.has("still")) {
        draw(Number(asked.get("still")))
        window.done = true
      } else {
        const { encodeFilm } = await import("./encode.js")
        const { blob, frames } = await encodeFilm({ canvas, total: TOTAL, bitrate: 8_000_000, ready: async () => {}, draw })
        window.film.frames = frames
        await fetch("out", { method: "POST", body: blob })
        window.done = true
      }
    </script>
  </body>
</html>
