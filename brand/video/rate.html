<!doctype html>
<!--
  A film for the post about an item's page saying its price in ZEC. One shot, no scenes: a price
  in dollars set very large; the question it leaves; the same price as an amount of ZEC whose
  digits roll over like a counter each time the rate moves, above a tape of the rate that runs
  across the screen, beside the path the question takes (browser, shop, sources); an order that
  fixes the amount to eight places while the tape runs on; and a closing line over the same tape.
  It shares nothing of its layout with the other films here (gift.html and those made from it).
  Drawn and encoded one frame at a time (encode.js); opened by compose.mjs with PAGE=rate.html.
  ?still=<seconds> draws one moment and stops.
  The item and its price are the shelf's on 12 Oct 2026. The rates are samples near that day's,
  and the film says so; every amount is worked out from them the way lib/price.ts does it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@500&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #09090b;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <script type="module">
      const W = 1920
      const H = 1080
      const GROUND = "#09090b"
      const CARD = "#101014"
      const RAISE = "#1c1c23"
      const ICE = "#f4f4f6"
      const INK = "#0b0b10"
      const QUIET = "rgba(244,244,246,0.58)"
      const FAINT = "rgba(244,244,246,0.3)"
      const INDIGO = "#5567ea"
      const BRAND = "#7b8cff"
      const NAVY = "#1f2358"
      const SANS = "Geist, system-ui, sans-serif"
      const MONO = '"Geist Mono", ui-monospace, monospace'
      const TOTAL = 14.8

      const canvas = document.getElementById("stage")
      const ctx = canvas.getContext("2d")
      const clamp = (x, low = 0, high = 1) => Math.min(high, Math.max(low, x))
      const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3)
      const easeBoth = (x) => {
        const t = clamp(x)
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
      }
      const settle = (x) => {
        const t = clamp(x)
        const c = 1.5
        return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2)
      }
      const mix = (a, b, p) => a + (b - a) * p
      const rounded = (x, y, w, h, r) => {
        ctx.beginPath()
        ctx.roundRect(x, y, w, h, r)
      }
      const text = (value, x, y, font, colour, align = "left", spacing = "0px") => {
        ctx.font = font
        ctx.fillStyle = colour
        ctx.textAlign = align
        ctx.letterSpacing = spacing
        ctx.fillText(value, x, y)
      }
      const widthOf = (value, font, spacing = "0px") => {
        ctx.font = font
        ctx.letterSpacing = spacing
        return ctx.measureText(value).width
      }
      // A line that rises into place from under its own baseline.
      const rise = (value, x, y, size, font, colour, p, spacing = "0px", align = "left") => {
        if (p <= 0) return
        ctx.save()
        const alpha = ctx.globalAlpha
        ctx.beginPath()
        ctx.rect(0, y - size * 0.95, W, size * 1.24)
        ctx.clip()
        ctx.globalAlpha = alpha * clamp(p * 1.6)
        text(value, x, y + (1 - easeOut(p)) * size * 0.9, font, colour, align, spacing)
        ctx.restore()
      }
      const MARK = [
        [8.1, 2, 22, 2, 13.25, 14.5, 10.65, 14.5, 15.9, 7, 4.6, 7],
        [19.4, 17, 15.9, 22, 2, 22, 10.75, 9.5, 13.35, 9.5, 8.1, 17],
        [5.5, 2, 7, 2, 3.5, 7, 2, 7],
        [20.5, 17, 22, 17, 18.5, 22, 17, 22],
      ]
      const logo = (x, y, size, colour) => {
        const k = size / 24
        ctx.fillStyle = colour
        for (const points of MARK) {
          ctx.beginPath()
          for (let i = 0; i < points.length; i += 2) ctx[i ? "lineTo" : "moveTo"](x + points[i] * k, y + points[i + 1] * k)
          ctx.closePath()
          ctx.fill()
        }
        text("zolace", x + size * 1.28, y + size * 0.86, `700 ${size * 0.95}px ${SANS}`, colour, "left", `${-size * 0.05}px`)
      }
      const BAYER = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38, 60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25, 15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21]
      const threshold = (cx, cy) => (BAYER[(((cy % 8) + 8) % 8) * 8 + (((cx % 8) + 8) % 8)] + 0.5) / 64

      // ------------------------------------------------------------ the numbers
      // The price, the rates the film runs through, and the amounts lib/price.ts would give.
      const CENTS = 1190
      const toZat = (cents, rate) => Math.ceil((cents / 100 / rate) * 100_000_000)
      const about = (cents, rate) => (Math.ceil(toZat(cents, rate) / 10_000) / 10_000).toFixed(4)
      const exact = (cents, rate) => (toZat(cents, rate) / 100_000_000).toFixed(8)
      const money = (rate) => `$${rate.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
      const ZEC_AT = 2.7
      const RATES = [
        { at: ZEC_AT, usd: 1307.28 },
        { at: 4.0, usd: 1289.1 },
        { at: 5.2, usd: 1322.45 },
        { at: 6.4, usd: 1301.6 },
        { at: 7.6, usd: 1310.75 },
        { at: 10.2, usd: 1296.3 },
        { at: 11.3, usd: 1318.02 },
        { at: 13.0, usd: 1304.9 },
      ]
      const ORDERED = 9.3
      const CLOSE = 12.2
      const rateIndex = (time) => {
        let on = 0
        for (let i = 0; i < RATES.length; i++) if (time >= RATES[i].at) on = i
        return on
      }
      // The rate as the tape draws it: a step, with a short run between two levels.
      const rateAt = (time) => {
        const on = rateIndex(time)
        if (on === 0) return RATES[0].usd
        return mix(RATES[on - 1].usd, RATES[on].usd, easeBoth((time - RATES[on].at) / 0.3))
      }
      // The amount on screen at each moment: about, to four places, until the order; then the
      // order's own, to eight, whatever the rate does after.
      const HELD = exact(CENTS, RATES[rateIndex(ORDERED)].usd)
      const amountAt = (time) => (time >= ORDERED ? HELD : about(CENTS, RATES[rateIndex(time)].usd))
      const changedAt = (time) => {
        if (time >= ORDERED) return ORDERED
        return RATES[rateIndex(time)].at
      }
      const before = (time) => {
        if (time >= ORDERED) return about(CENTS, RATES[rateIndex(ORDERED)].usd)
        const on = rateIndex(time)
        return on === 0 ? "" : about(CENTS, RATES[on - 1].usd)
      }

      // A row of figures in cells of one width, where a figure that changed rolls up out of its
      // cell while the new one rolls in from under it, one cell after another.
      function counter(now, was, p, x, baseline, size, colour) {
        const font = `500 ${size}px ${MONO}`
        const cell = widthOf("0", font, "0px") * 0.94
        // The first cell that changed leads; the ones after it follow in turn.
        let lead = 0
        while (lead < now.length && now[lead] === (was[lead] ?? "")) lead++
        for (let i = 0; i < now.length; i++) {
          const fresh = now[i]
          const old = was[i] ?? ""
          const left = x + i * cell
          if (fresh === old) {
            text(fresh, left, baseline, font, colour, "left", "0px")
            continue
          }
          const q = easeBoth(clamp(p * 1.5 - (i - lead) * 0.07))
          ctx.save()
          ctx.beginPath()
          ctx.rect(left - 4, baseline - size * 0.82, cell + 8, size * 1.02)
          ctx.clip()
          if (old) text(old, left, baseline - q * size * 1.02, font, colour, "left", "0px")
          text(fresh, left, baseline + (1 - q) * size * 1.02, font, q < 1 ? BRAND : colour, "left", "0px")
          ctx.restore()
        }
        return cell * now.length
      }

      // ------------------------------------------------------------ the tape of the rate
      const TAPE = { top: 846, bottom: 1010, head: 1500, step: 16, speed: 150, low: 1282, high: 1328 }
      const levelY = (usd) => TAPE.bottom - ((usd - TAPE.low) / (TAPE.high - TAPE.low)) * (TAPE.bottom - TAPE.top)
      function tape(time) {
        if (time < ZEC_AT) return
        const run = (time - ZEC_AT) * TAPE.speed
        const offset = run % TAPE.step
        const first = Math.floor(run / TAPE.step)
        for (let n = 0; TAPE.head - n * TAPE.step - offset > -TAPE.step; n++) {
          const x = TAPE.head - n * TAPE.step - offset
          const when = time - (n * TAPE.step + offset) / TAPE.speed
          if (when < ZEC_AT) break
          const y = Math.round(levelY(rateAt(when)) / 4) * 4
          const column = first - n
          ctx.fillStyle = BRAND
          ctx.fillRect(x, y, 10, 10)
          // Under the line, the site's dither, thinning as it falls.
          ctx.fillStyle = NAVY
          for (let row = 1; y + row * TAPE.step < H; row++) {
            if (threshold(column, row) < 0.62 - row * 0.05) ctx.fillRect(x, y + row * TAPE.step, 10, 10)
          }
        }
        // The rate at the head of the tape.
        const on = rateIndex(time)
        const y = levelY(rateAt(time))
        const label = `1 ZEC ≈ ${money(RATES[on].usd)}`
        const font = `500 22px ${MONO}`
        const wide = widthOf(label, font, "0.2px") + 44
        ctx.fillStyle = ICE
        ctx.fillRect(TAPE.head + 16, y - 6, 22, 22)
        ctx.fillStyle = RAISE
        rounded(TAPE.head + 56, y - 22, wide, 54, 12)
        ctx.fill()
        rise(label, TAPE.head + 78, y + 13, 22, font, ICE, clamp((time - RATES[on].at) / 0.35), "0.2px")
      }

      // ------------------------------------------------------------ the path the question takes
      const PATH = { x: 1424, w: 400, tops: [232, 366, 500], h: 86 }
      const STOPS = [
        ["YOUR BROWSER", "ASKS FOR THE RATE"],
        ["ZOLACE", "THE SAME ANSWER FOR EVERYONE"],
        ["TWO PRICE SOURCES", "THEY NEVER HEAR FROM YOU"],
      ]
      function path(time, alpha) {
        if (alpha <= 0) return
        STOPS.forEach(([name, note], index) => {
          const p = (time - (3.2 + index * 0.18)) / 0.5
          if (p <= 0) return
          const y = PATH.tops[index] + (1 - settle(p)) * 50
          ctx.globalAlpha = alpha * clamp(p * 1.8)
          ctx.fillStyle = index === 1 ? INDIGO : CARD
          rounded(PATH.x, y, PATH.w, PATH.h, 18)
          ctx.fill()
          ctx.fillStyle = index === 1 ? "#fff" : BRAND
          ctx.fillRect(PATH.x + 26, y + 26, 10, 10)
          text(name, PATH.x + 50, y + 38, `500 19px ${MONO}`, index === 1 ? "#fff" : ICE, "left", "1.4px")
          text(note, PATH.x + 50, y + 64, `500 14px ${MONO}`, index === 1 ? "rgba(255,255,255,0.75)" : QUIET, "left", "1.2px")
        })
        // What travels: the question down, the answer back up, a little before each new rate.
        for (const rate of RATES) {
          if (rate.at <= ZEC_AT || rate.at > ORDERED) continue
          const p = (time - (rate.at - 0.62)) / 0.62
          if (p <= 0 || p >= 1) continue
          const legs = [
            [0, 1, 0.0, 0.3, ICE],
            [1, 2, 0.16, 0.46, BRAND],
            [2, 1, 0.5, 0.8, BRAND],
            [1, 0, 0.66, 0.96, ICE],
          ]
          for (const [from, to, start, end, colour] of legs) {
            const q = (p - start) / (end - start)
            if (q <= 0 || q >= 1) continue
            const down = to > from
            const a = down ? PATH.tops[from] + PATH.h : PATH.tops[from]
            const b = down ? PATH.tops[to] : PATH.tops[to] + PATH.h
            ctx.globalAlpha = alpha * Math.sin(Math.PI * q)
            ctx.fillStyle = colour
            ctx.fillRect(PATH.x + (down ? 120 : 260), mix(a, b, easeBoth(q)) - 7, 14, 14)
          }
        }
        ctx.globalAlpha = 1
      }

      // ------------------------------------------------------------ the film
      function draw(time) {
        ctx.globalAlpha = 1
        ctx.shadowColor = "transparent"
        ctx.fillStyle = GROUND
        ctx.fillRect(0, 0, W, H)

        const closing = easeBoth((time - CLOSE) / 0.5)
        const up = closing * 90
        const upper = 1 - closing

        // The name, from the first frame to the last.
        ctx.globalAlpha = easeOut(time / 0.4)
        logo(96, 70, 46, ICE)
        text("PRICE IN ZEC · NEW IN THE SHOP", W - 96, 104, `500 21px ${MONO}`, QUIET, "right", "1.8px")
        ctx.globalAlpha = 1

        tape(time)

        // ---------------------------------------- the price in dollars
        // Very large and alone at first; then it steps aside, small, and stays where it is.
        const aside = easeBoth((time - 2.35) / 0.6)
        const size = mix(330, 104, aside)
        const priceFont = `500 ${size}px ${MONO}`
        const priceWide = widthOf("0", priceFont, "0px") * 0.94 * 6
        const priceX = mix(W / 2 - priceWide / 2, 96, aside)
        const priceY = mix(640, 300, aside) - up
        ctx.globalAlpha = upper
        counter("$11.90", "      ", (time - 0.15) / 0.9, priceX, priceY, size, ICE)
        if (aside < 1) {
          ctx.globalAlpha = (1 - aside) * easeOut((time - 0.2) / 0.4)
          text("DISCORD NITRO, 1 MONTH (USD)", W / 2, 330, `500 22px ${MONO}`, QUIET, "center", "2px")
          ctx.globalAlpha = 1 - aside
          rise("The price is set in dollars.", W / 2, 776, 44, `400 44px ${SANS}`, QUIET, clamp((time - 1.0) / 0.5), "-1px", "center")
          rise("So how much ZEC is that?", W / 2, 840, 44, `500 44px ${SANS}`, ICE, clamp((time - 1.5) / 0.5), "-1px", "center")
        }
        if (aside > 0) {
          ctx.globalAlpha = upper * aside
          text("DISCORD NITRO, 1 MONTH (USD)", 96 + priceWide + 34, 264 - up, `500 17px ${MONO}`, ICE, "left", "1.5px")
          text("SET IN DOLLARS. IT DOES NOT MOVE.", 96 + priceWide + 34, 294 - up, `500 17px ${MONO}`, QUIET, "left", "1.5px")
        }

        // ---------------------------------------- the amount in ZEC
        const shown = easeOut((time - ZEC_AT) / 0.4)
        if (shown > 0) {
          const ordered = time >= ORDERED
          ctx.globalAlpha = upper * shown
          // What kind of figure this is.
          const label = ordered ? "Fixed by your order" : "About, right now"
          const tagFont = `500 21px ${MONO}`
          const tagWide = widthOf(label, tagFont, "1.4px") + 62
          ctx.fillStyle = ordered ? BRAND : RAISE
          rounded(96, 352 - up, tagWide, 46, 12)
          ctx.fill()
          ctx.fillStyle = ordered ? INK : BRAND
          ctx.fillRect(114, 371 - up, 9, 9)
          text(label, 136, 383 - up, tagFont, ordered ? INK : ICE, "left", "1.4px")
          if (ordered) {
            // The hold, counted down a second at a time.
            const left = 15 * 60 - Math.floor(time - ORDERED)
            const clock = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`
            text(`PRICE HELD FOR ${clock}`, 96 + tagWide + 28, 383 - up, `500 19px ${MONO}`, ICE, "left", "1.6px")
          } else {
            // Half a minute, a square at a time, until the rate is asked again.
            const on = rateIndex(time)
            const next = RATES[on + 1]?.at ?? time + 1
            const through = clamp((time - RATES[on].at) / (next - RATES[on].at))
            for (let i = 0; i < 30; i++) {
              ctx.fillStyle = i / 30 < through ? BRAND : "#2a2a33"
              ctx.fillRect(96 + tagWide + 28 + i * 13, 371 - up, 9, 9)
            }
            text("ASKED AGAIN EVERY 30 S", 96 + tagWide + 28 + 30 * 13 + 18, 382 - up, `500 16px ${MONO}`, QUIET, "left", "1.4px")
          }
          // The figures themselves: large, and smaller once they are eight places long.
          const grown = easeBoth((time - ORDERED) / 0.55)
          const big = mix(300, 214, grown)
          const amount = amountAt(time)
          const wide = counter(amount, before(time), (time - changedAt(time)) / (ordered ? 1.1 : 0.7), 96, 690 - up, big, ICE)
          // The unit stands after the figures, and moves out as the row grows from four places to eight.
          const cells = mix(6, amount.length, ordered ? easeOut((time - ORDERED) / 0.42) : 1)
          text("ZEC", 96 + (wide / amount.length) * cells + mix(34, 26, grown), 690 - up, `500 ${mix(96, 78, grown)}px ${SANS}`, BRAND, "left", "-3px")
          ctx.globalAlpha = 1
        }

        // The path, until the order; then the button that places it.
        path(time, upper * (1 - easeOut((time - 8.5) / 0.4)))
        const button = Math.min(easeOut((time - 8.7) / 0.4), 1 - easeOut((time - (ORDERED + 0.35)) / 0.35))
        if (button > 0) {
          const pressed = time >= ORDERED
          const squeeze = pressed ? 1 - 0.07 * Math.sin(Math.PI * clamp((time - ORDERED) / 0.26)) : 1
          ctx.save()
          ctx.globalAlpha = button
          ctx.translate(PATH.x + PATH.w / 2, 360 + (1 - button) * 30)
          ctx.scale(squeeze, squeeze)
          ctx.fillStyle = pressed ? BRAND : INDIGO
          rounded(-PATH.w / 2, -52, PATH.w, 104, 20)
          ctx.fill()
          text("PLACE THE ORDER", 0, 9, `500 24px ${MONO}`, pressed ? INK : "#fff", "center", "2px")
          ctx.restore()
        }

        // A line over the tape: what the rates are, then what the order did.
        if (time >= ZEC_AT) {
          const held = easeOut((time - (ORDERED + 0.9)) / 0.5)
          ctx.globalAlpha = upper * easeOut((time - 3.4) / 0.5) * (1 - held)
          text("SAMPLE RATES · TWO SOURCES, COMPARED WITH EACH OTHER", 96, 800 - up, `500 17px ${MONO}`, FAINT, "left", "1.6px")
          ctx.globalAlpha = upper * held
          text("THE RATE KEEPS MOVING. YOUR AMOUNT DOES NOT.", 96, 800 - up, `500 19px ${MONO}`, BRAND, "left", "1.6px")
          ctx.globalAlpha = 1
        }

        // ---------------------------------------- the closing line, over the same tape
        if (closing > 0) {
          const t = time - CLOSE
          const font = `500 148px ${SANS}`
          rise("Know the ZEC", 90, 420, 148, font, ICE, clamp((t - 0.55) / 0.7), "-8px")
          rise("before you order.", 90, 580, 148, font, BRAND, clamp((t - 0.73) / 0.7), "-8px")
          ctx.globalAlpha = easeOut((t - 1.0) / 0.5)
          text("ON EVERY ITEM'S PAGE · ASKED OF ZOLACE, NEVER OF AN EXCHANGE", 96, 668, `500 20px ${MONO}`, QUIET, "left", "1.8px")
          const tag = "zolace.cash/shop"
          const tagFont = `500 21px ${MONO}`
          const tagWide = widthOf(tag, tagFont, "1.4px") + 62
          ctx.fillStyle = RAISE
          rounded(96, 716, tagWide, 46, 12)
          ctx.fill()
          ctx.fillStyle = BRAND
          ctx.fillRect(114, 735, 9, 9)
          text(tag, 136, 747, tagFont, ICE, "left", "1.4px")
          ctx.globalAlpha = 1
        }

        const left = TOTAL - time
        if (left < 0.3) {
          ctx.globalAlpha = 1 - clamp(left / 0.3)
          ctx.fillStyle = "#050507"
          ctx.fillRect(0, 0, W, H)
          ctx.globalAlpha = 1
        }
      }

      await Promise.all([
        document.fonts.load(`500 148px ${SANS}`),
        document.fonts.load(`400 44px ${SANS}`),
        document.fonts.load(`700 46px ${SANS}`),
        document.fonts.load(`500 300px ${MONO}`),
      ])
      const asked = new URLSearchParams(location.search)
      window.film = { total: TOTAL, held: HELD }
      if (asked.has("still")) {
        draw(Number(asked.get("still")))
        window.done = true
      } else {
        const { encodeFilm } = await import("./encode.js")
        const { blob, frames } = await encodeFilm({ canvas, total: TOTAL, bitrate: 9_000_000, ready: async () => {}, draw })
        window.film.frames = frames
        await fetch("out", { method: "POST", body: blob })
        window.done = true
      }
    </script>
  </body>
</html>
