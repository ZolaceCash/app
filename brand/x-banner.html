<!doctype html>
<!--
  The header image for the X profile, 1500 x 500. Open it in a browser and take a screenshot of the
  page at that size (brand/render.mjs does it at twice the size). Text and one stack of cards, no
  icons. The left third is left empty on purpose: the profile picture sits over its lower part.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #09090b;
        --ice: #f4f4f6;
        --ink: #0b0b10;
        --indigo: #5567ea;
        --navy: #1f2358;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1500px;
        height: 500px;
        overflow: hidden;
        background-color: var(--ground);
        /* The site's ground: a faint grid of dots. */
        background-image: radial-gradient(rgb(255 255 255 / 0.055) 1px, transparent 1px);
        background-size: 28px 28px;
        color: var(--ice);
        font-family: "Geist", system-ui, sans-serif;
        position: relative;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .text {
        position: absolute;
        left: 416px;
        top: 126px;
      }
      /* The site's logo as it stands in the nav: the mark beside the name in bold lowercase. */
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .logo svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
      }
      h1 {
        margin-top: 26px;
        font-weight: 500;
        font-size: 78px;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      .sub {
        margin-top: 30px;
        color: rgb(244 244 246 / 0.55);
      }
      .card {
        position: absolute;
        width: 420px;
        height: 240px;
        border-radius: 22px;
        padding: 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .card canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .card > div {
        position: relative;
      }
      .back {
        left: 1034px;
        top: 86px;
        background: var(--ice);
        color: var(--ink);
        transform: rotate(7deg);
      }
      .front {
        left: 992px;
        top: 148px;
        background: var(--indigo);
        transform: rotate(-4deg);
        box-shadow: 0 40px 80px -30px rgb(0 0 0 / 0.9);
      }
      .head {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .head span + span {
        opacity: 0.65;
      }
      .numeral {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 46px;
        line-height: 0.8;
        letter-spacing: -0.08em;
        color: transparent;
        -webkit-text-stroke: 1.25px rgb(255 255 255 / 0.34);
      }
      .title {
        margin-top: 12px;
        max-width: 58%;
        font-weight: 500;
        font-size: 25px;
        line-height: 1.06;
        letter-spacing: -0.035em;
      }
      .note {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10px;
        opacity: 0.78;
      }
      .note::before {
        content: "";
        width: 4px;
        height: 4px;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <p class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="8.1,2 22,2 13.25,14.5 10.65,14.5 15.9,7 4.6,7" />
          <polygon points="19.4,17 15.9,22 2,22 10.75,9.5 13.35,9.5 8.1,17" />
          <polygon points="5.5,2 7,2 3.5,7 2,7" />
          <polygon points="20.5,17 22,17 18.5,22 17,22" />
        </svg>
        zolace
      </p>
      <h1>Pay shielded.<br />Get the goods.</h1>
      <p class="mono sub">No account · Paid in shielded ZEC</p>
    </div>

    <div class="card back">
      <canvas data-figure="contour" data-ink="#5567ea"></canvas>
      <div class="mono head"><span>Checkout</span></div>
    </div>

    <div class="card front">
      <canvas data-figure="flow" data-ink="#1f2358"></canvas>
      <div class="mono head"><span>Shop</span><span>01 / 07</span></div>
      <div>
        <p class="numeral">01</p>
        <p class="title">Codes, licences and gift cards</p>
        <p class="mono note">First on the shelf</p>
      </div>
    </div>

    <script>
      // The site's shader graphic, drawn once on a canvas: the same noise, the same ordered dither,
      // one canvas pixel for every three on the page (components/site/shader-fill.tsx).
      const CELL = 3
      const fract = (x) => x - Math.floor(x)
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)))
        return t * t * (3 - 2 * t)
      }
      const hash = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453)
      const noise = (x, y) => {
        const ix = Math.floor(x)
        const iy = Math.floor(y)
        let fx = x - ix
        let fy = y - iy
        fx = fx * fx * (3 - 2 * fx)
        fy = fy * fy * (3 - 2 * fy)
        const top = hash(ix, iy) + (hash(ix + 1, iy) - hash(ix, iy)) * fx
        const bottom = hash(ix, iy + 1) + (hash(ix + 1, iy + 1) - hash(ix, iy + 1)) * fx
        return top + (bottom - top) * fy
      }
      const fbm = (x, y) => {
        let value = 0
        let weight = 0.5
        for (let i = 0; i < 4; i++) {
          value += weight * noise(x, y)
          x *= 2.03
          y *= 2.03
          weight *= 0.5
        }
        return value
      }
      const bayer2 = (x, y) => fract(Math.floor(x) / 2 + Math.floor(y) * Math.floor(y) * 0.75)
      const bayer4 = (x, y) => bayer2(0.5 * x, 0.5 * y) * 0.25 + bayer2(x, y)

      for (const canvas of document.querySelectorAll("canvas")) {
        const width = Math.round(canvas.clientWidth / CELL)
        const height = Math.round(canvas.clientHeight / CELL)
        canvas.width = width
        canvas.height = height
        const context = canvas.getContext("2d")
        context.fillStyle = canvas.dataset.ink
        const aspect = width / height
        for (let py = 0; py < height; py++) {
          for (let px = 0; px < width; px++) {
            const u = (px + 0.5) / width
            // v runs upward, as in the shader.
            const v = 1 - (py + 0.5) / height
            const qx = u * aspect
            let value
            if (canvas.dataset.figure === "flow") {
              value = smoothstep(0.3, 0.8, fbm(qx * 2.4 + 3.1, v * 2.4 + 1.7))
            } else {
              const field = fbm(qx * 1.7 + 0.6, v * 1.7 + 4.2)
              value = Math.abs(fract(field * 8) - 0.5) <= 0.06 ? 1 : 0
            }
            const room = smoothstep(0.6, 1, u) * (1 - smoothstep(0.6, 0.8, v)) * smoothstep(0, 0.12, v)
            if (bayer4(px, height - py) + 0.03 <= value * room) context.fillRect(px, py, 1, 1)
          }
        }
      }
    </script>
  </body>
</html>
