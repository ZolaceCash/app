<!doctype html>
<!--
  The picture for the post that says the docs are up, 1600 x 900. brand/render.mjs renders it at
  twice the size. Its layout is its own: the eight pages of the docs as a run of sheets stepping
  down and to the right, each showing its number and its title, with an indigo cover in front.
  The titles are the docs' own, in their order (lib/docs.ts). When a page is added, renamed or
  moved there, change the list in the script below and render again.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&family=Geist+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #09090b;
        --ice: #f4f4f6;
        --indigo: #5567ea;
        --brand: #7b8cff;
        --quiet: rgb(244 244 246 / 0.58);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        background-color: var(--ground);
        /* The site's ground: a faint grid of dots. */
        background-image: radial-gradient(rgb(255 255 255 / 0.055) 1px, transparent 1px);
        background-size: 28px 28px;
        color: var(--ice);
        font-family: "Geist", system-ui, sans-serif;
        position: relative;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* The site's logo as it stands in the nav: the mark beside the name in bold lowercase. */
      .logo {
        position: absolute;
        left: 80px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 38px;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .logo svg {
        width: 40px;
        height: 40px;
        fill: currentColor;
      }
      .text {
        position: absolute;
        left: 80px;
        bottom: 64px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--brand);
      }
      .eyebrow::before {
        content: "";
        width: 8px;
        height: 8px;
        background: currentColor;
      }
      h1 {
        margin-top: 26px;
        margin-left: -4px;
        font-weight: 500;
        font-size: 132px;
        line-height: 0.92;
        letter-spacing: -0.055em;
        white-space: nowrap;
      }
      h1 em {
        font-style: normal;
        color: var(--brand);
      }
      /* One sheet. Where it sits and how light it is come from its place in the run. */
      .sheet {
        position: absolute;
        width: 600px;
        height: 340px;
        border-radius: 22px;
        padding: 0 26px;
        box-shadow: 0 -20px 44px -18px rgb(0 0 0 / 0.75);
        overflow: hidden;
      }
      .sheet .tab {
        height: 54px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-weight: 500;
        font-size: 25px;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .sheet .tab .mono {
        font-size: 15px;
        color: var(--quiet);
      }
      .cover {
        background: var(--indigo);
        color: #fff;
        padding: 26px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .cover canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .cover > div {
        position: relative;
      }
      .cover .head {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .cover .head span + span {
        opacity: 0.7;
      }
      .cover .where {
        font-weight: 500;
        font-size: 56px;
        line-height: 1;
        letter-spacing: -0.045em;
      }
      .cover .note {
        margin-top: 16px;
        font-size: 14px;
        opacity: 0.82;
      }
    </style>
  </head>
  <body>
    <p class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="8.1,2 22,2 13.25,14.5 10.65,14.5 15.9,7 4.6,7" />
        <polygon points="19.4,17 15.9,22 2,22 10.75,9.5 13.35,9.5 8.1,17" />
        <polygon points="5.5,2 7,2 3.5,7 2,7" />
        <polygon points="20.5,17 22,17 18.5,22 17,22" />
      </svg>
      zolace
    </p>

    <div class="text">
      <p class="mono eyebrow">How the shop works</p>
      <h1>The docs<br />are <em>live.</em></h1>
    </div>

    <div id="run"></div>

    <script>
      // The docs' pages, in their order (lib/docs.ts).
      const PAGES = [
        "Overview",
        "Placing an order",
        "Paying in ZEC",
        "Order states",
        "Delivery",
        "Refunds",
        "Privacy",
        "The token",
      ]
      const LEFT = 440
      const TOP = 64
      const ACROSS = 60
      const DOWN = 54
      const run = document.getElementById("run")
      const place = (sheet, at) => {
        sheet.style.left = `${LEFT + ACROSS * at}px`
        sheet.style.top = `${TOP + DOWN * at}px`
      }
      PAGES.forEach((title, at) => {
        const sheet = document.createElement("div")
        sheet.className = "sheet"
        place(sheet, at)
        // Each sheet a little lighter than the one behind it, so their edges read without a line.
        const light = 19 + at * 2.6
        sheet.style.background = `rgb(${light} ${light} ${light + 5})`
        sheet.innerHTML = `<p class="tab"><span class="mono">${String(at + 1).padStart(2, "0")}</span>${title}</p>`
        run.append(sheet)
      })
      const cover = document.createElement("div")
      cover.className = "sheet cover"
      place(cover, PAGES.length)
      cover.innerHTML = `
        <canvas></canvas>
        <div class="mono head"><span>Docs</span><span>${PAGES.length} pages</span></div>
        <div>
          <p class="where">zolace.cash/docs</p>
          <p class="mono note">Read it before the first items land</p>
        </div>`
      run.append(cover)

      // The site's shader graphic, drawn once on a canvas: the same noise, the same ordered dither,
      // one canvas pixel for every three on the page (components/site/shader-fill.tsx).
      const CELL = 3
      const fract = (x) => x - Math.floor(x)
      const smoothstep = (a, b, x) => {
        const t = Math.min(1, Math.max(0, (x - a) / (b - a)))
        return t * t * (3 - 2 * t)
      }
      const hash = (x, y) => fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453)
      const noise = (x, y) => {
        const ix = Math.floor(x)
        const iy = Math.floor(y)
        let fx = x - ix
        let fy = y - iy
        fx = fx * fx * (3 - 2 * fx)
        fy = fy * fy * (3 - 2 * fy)
        const top = hash(ix, iy) + (hash(ix + 1, iy) - hash(ix, iy)) * fx
        const bottom = hash(ix, iy + 1) + (hash(ix + 1, iy + 1) - hash(ix, iy + 1)) * fx
        return top + (bottom - top) * fy
      }
      const fbm = (x, y) => {
        let value = 0
        let weight = 0.5
        for (let i = 0; i < 4; i++) {
          value += weight * noise(x, y)
          x *= 2.03
          y *= 2.03
          weight *= 0.5
        }
        return value
      }
      const bayer2 = (x, y) => fract(Math.floor(x) / 2 + Math.floor(y) * Math.floor(y) * 0.75)
      const bayer4 = (x, y) => bayer2(0.5 * x, 0.5 * y) * 0.25 + bayer2(x, y)

      const canvas = cover.querySelector("canvas")
      const width = Math.round(canvas.clientWidth / CELL)
      const height = Math.round(canvas.clientHeight / CELL)
      canvas.width = width
      canvas.height = height
      const context = canvas.getContext("2d")
      context.fillStyle = "#1f2358"
      const aspect = width / height
      for (let py = 0; py < height; py++) {
        for (let px = 0; px < width; px++) {
          const u = (px + 0.5) / width
          // v runs upward, as in the shader.
          const v = 1 - (py + 0.5) / height
          const value = smoothstep(0.3, 0.8, fbm(u * aspect * 2.4 + 3.1, v * 2.4 + 1.7))
          // Kept to the right, between the line at the top and the address at the bottom.
          const room = smoothstep(0.5, 1, u) * smoothstep(0.4, 0.58, v) * (1 - smoothstep(0.7, 0.82, v))
          if (bayer4(px, height - py) + 0.03 <= value * room) context.fillRect(px, py, 1, 1)
        }
      }
    </script>
  </body>
</html>
