# Zolace on one server: the site, nginx in front of it, and certbot for the certificate.
# Cloudflare sits in front of nginx (deploy/README.md has the steps and what that costs in privacy).
#
#   cp deploy/env.example .env        # then fill it in: it is the only file with secrets
#   sh deploy/init-cert.sh            # once, for the first certificate
#   docker compose up -d --build

name: zolace

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      # Without a .env the start already stops at DOMAIN below, with a message that says why.
      - path: .env
        required: false
    environment:
      # The database is local: one SQLite file on the volume below, opened by the site itself.
      # There is no database server to run and no network between the site and its data. A
      # DATABASE_URL in .env replaces this, for a hosted database.
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/zolace.db}
      # Real payments. The shop takes them only when PAYMENT_NETWORK is "mainnet" (or "testnet") and
      # the engine below was given a viewing key. Otherwise it takes test orders, as it always has.
      PAYMENT_NETWORK: ${PAYMENT_NETWORK:-}
      CIPHERPAY_URL: http://engine:3080
      CIPHERPAY_API_KEY_FILE: /run/engine/api_key
      CIPHERSCAN_API_URL: ${CIPHERSCAN_API_URL:-}
      # SECRET. The key to the owner's account at the eSIM supplier (eSIM Access). With it, an item
      # made "when paid" is bought there out of the owner's balance as soon as its order is paid.
      # Empty: no such item is sold. It can spend that balance and nothing else.
      ESIMACCESS_CODE: ${ESIMACCESS_CODE:-}
      # How many hours the owner has to buy an item that is bought after it is paid, and to hand it
      # over. After that the payment is owed back. Empty: 12.
      HAND_HOURS: ${HAND_HOURS:-}
      # Other sellers. "open": anyone can sign up with a viewing key and list items, and an order
      # of a seller's item is paid straight to that seller's wallet. It also takes real payments
      # (PAYMENT_NETWORK and the engine): without them nobody can sign up. Empty: selling is off,
      # and no seller's item is shown or sold.
      SELLING: ${SELLING:-}
      # The most a seller's item may cost, in dollars, and the most items one seller may list.
      # Empty: 100 and 20.
      SELLER_MAX_PRICE: ${SELLER_MAX_PRICE:-}
      SELLER_MAX_ITEMS: ${SELLER_MAX_ITEMS:-}
      # SECRET. Where the server sends a line when something waits for the owner (a paid order to
      # buy an item for, a buyer's report, a refund that is due): the address of a notification
      # service, such as an ntfy topic. The line names no order, no item and no amount. Whoever
      # knows this address can read those lines. Empty: no notice is sent.
      OWNER_NOTIFY_URL: ${OWNER_NOTIFY_URL:-}
    volumes:
      # Where that file lives. It stays on this server and outlives the container.
      - zolace-data:/app/data
      # The key to the payment engine, left there by engine-setup.
      - engine-keys:/run/engine:ro
    # Reached by nginx only. No port of the app is published on the host.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env (copy deploy/env.example)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/zolace.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
    # nginx reads a renewed certificate only when told to: reload it twice a day.
    command: ["/bin/sh", "-c", "while :; do sleep 12h & wait $$!; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]

  certbot:
    # Proves the domain is ours through Cloudflare's DNS, so no request has to reach this server
    # for a certificate, and it works with Cloudflare's proxy switched on.
    image: certbot/dns-cloudflare:latest
    restart: unless-stopped
    environment:
      # The token that lets certbot write the proof into the domain's DNS at Cloudflare.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./deploy/certbot.sh:/usr/local/bin/zolace-certbot:ro
    # Looks twice a day. A certificate is only replaced when it has under 30 days left.
    entrypoint: ["/bin/sh", "/usr/local/bin/zolace-certbot", "renew-forever"]

  # The payment engine (engine/cipherpay/). It watches the Zcash chain with a viewing key and
  # tells the site what arrived at each order's address. It cannot spend. Only the site reaches
  # it: no port is published. Until ENGINE_ENCRYPTION_KEY is set it is switched off, and the
  # container waits and does nothing.
  engine:
    build: ./engine/cipherpay
    restart: unless-stopped
    environment:
      NETWORK: ${PAYMENT_NETWORK:-mainnet}
      # Which chain explorer the engine reads. Empty: the public one for its network.
      CIPHERSCAN_API_URL: ${CIPHERSCAN_API_URL:-}
      # SECRET. 64 hex characters. Encrypts the viewing key where the engine stores it.
      ENCRYPTION_KEY: ${ENGINE_ENCRYPTION_KEY:-}
      DATABASE_URL: sqlite:/data/cipherpay.db?mode=rwc
      API_HOST: 0.0.0.0
      API_PORT: "3080"
      ALLOWED_ORIGINS: http://app:3000
      # An unpaid invoice and a paid one are both watched for seven days, so that a payment that
      # comes late, or twice, is found and owed back (PAYMENT_WATCH_HOURS on the site).
      INVOICE_EXPIRY_MINUTES: "10080"
      PAID_WATCH_HOURS: "168"
    volumes:
      - engine-data:/data
    healthcheck:
      # Switched off counts as well. Switched on, any answer does: the site asks the engine itself
      # whether it is fit to take an order.
      test: ["CMD-SHELL", "[ -z \"$$ENCRYPTION_KEY\" ] || curl -s -o /dev/null http://127.0.0.1:3080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Gives the engine the shop's viewing key, once, and leaves the key to the engine where the
  # site reads it (engine/cipherpay/register.sh). It runs at each start and ends at once.
  engine-setup:
    build: ./engine/cipherpay
    restart: "no"
    command: ["zolace-register"]
    depends_on:
      - engine
    environment:
      # SECRET. The unified full viewing key of the shop's wallet (uview1...). Never the seed.
      ZCASH_VIEWING_KEY: ${ZCASH_VIEWING_KEY:-}
      ENCRYPTION_KEY: ${ENGINE_ENCRYPTION_KEY:-}
    volumes:
      - engine-keys:/keys

volumes:
  zolace-data:
  letsencrypt:
  # The engine's own records, and the key the site uses to talk to it. Removing one without the
  # other leaves a key the engine no longer knows: remove both, and it registers again.
  engine-data:
  engine-keys:
